name: Weekly Goldmine Scan

on:
  schedule:
    # 매주 일요일 23:00 UTC (월요일 08:00 KST)
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      roots_override:
        description: '특정 뿌리만 스캔 (쉼표 구분, 비우면 전체)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write

jobs:
  goldmine-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run longtail goldmine scanner
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID_DIVE }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET_DIVE }}
        run: python scripts/longtail_goldmine.py

      - name: Build goldmine dashboard section
        run: python scripts/build_goldmine_section.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/longtail_goldmine.json docs/index.html docs/goldmine.html
          git diff --staged --quiet || git commit -m "goldmine: $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M)"
          # 2026-09-27: 3번 다 실패해도 마지막 명령(sleep)이 성공이라 실행이 성공으로 끝나던 것을 고침 — 실패하면 실패로 끝낸다.
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            echo "Push failed (attempt $i), retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$pushed" != "1" ]; then echo "::error::push 가 3번 모두 실패"; exit 1; fi
