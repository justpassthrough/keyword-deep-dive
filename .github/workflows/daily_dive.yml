name: Daily Deep Dive
on:
  schedule:
    - cron: '30 22 * * *'  # 07:30 KST
    - cron: '0 4 * * *'    # 13:00 KST
    - cron: '0 10 * * *'   # 19:00 KST
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
jobs:
  dive:
    runs-on: ubuntu-latest
    # 러너 미확보("job was not acquired by Runner") 등 GitHub 측 일시적 장애로
    # 실패 메일이 오지 않도록 워크플로우를 항상 success로 마무리한다.
    # dive는 하루 3회 돌아 한 번 걸러도 다음 실행이 복구하므로 실피해 없음.
    # 진짜 코드 오류는 맨 아래 "Notify Telegram on real failure" 스텝이 텔레그램으로 알린다.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        id: deps
        run: pip install -r requirements.txt
      - name: Run dive
        id: run_dive
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID_DIVE }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET_DIVE }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
        run: python scripts/dive.py
      # 참고: hot_combo.py(인물 화제 조합) 생성은 로컬에서 자동 실행(작업 스케줄러)함.
      #   Actions 데이터센터 IP는 네이버 인물검증 페이지가 막혀 인물이 거의 안 잡힘.
      #   여기선 로컬이 푸시한 data/hot_combos.json을 읽어 대시보드에 주입만 한다.
      - name: Build dashboard
        id: build
        run: python scripts/build_dashboard.py
      - name: Inject goldmine section (if data exists)
        run: python scripts/build_goldmine_section.py --inject || true
      - name: Inject hot combo section (if data exists)
        run: python scripts/build_hot_section.py --inject || true
      - name: Commit and push
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "dive: $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done
      # 진짜 오류(코드/API/푸시 실패)만 텔레그램으로 조용히 알린다.
      # 러너를 아예 못 잡은 일시적 장애면 이 스텝도 안 돌아 아무 알림이 없다
      # (= 무해, 다음 실행이 복구). outcome은 continue-on-error에 영향받지 않는
      # 원래 결과라 일시적 장애와 진짜 오류를 정확히 구분한다.
      - name: Notify Telegram on real failure
        if: always() && (steps.deps.outcome == 'failure' || steps.run_dive.outcome == 'failure' || steps.build.outcome == 'failure' || steps.push.outcome == 'failure')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests -q || true
          python scripts/notify_telegram.py "⚠️ Daily Deep Dive 실제 오류 (일시적 러너 문제 아님) — deps=${{ steps.deps.outcome }} dive=${{ steps.run_dive.outcome }} build=${{ steps.build.outcome }} push=${{ steps.push.outcome }} · 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
